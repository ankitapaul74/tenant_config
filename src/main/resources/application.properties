
spring.application.name=tenant-config

spring.datasource.url=jdbc:mysql://localhost:3306/tenant_config_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Do not run schema updates during startup
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

# Allow startup even if MySQL is temporarily unavailable
spring.datasource.hikari.initialization-fail-timeout=-1

# Avoid database metadata lookup during Hibernate startup
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
